name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The xcode-27 image defaults to Xcode 27.0. Build with 27.1, the Xcode the
# app is developed on, so CI compiles against the same SDKs.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  build-and-test:
    # Needs Xcode 26+ (Swift 6.2: main-actor default isolation).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # Ad-hoc signing (not CODE_SIGNING_ALLOWED=NO): the test host must
      # carry its sandbox entitlements, and the artifact stays launchable.
      # The ad-hoc entitlements leave out iCloud, which needs a provisioning
      # profile; without it the app saves to Downloads, as it does signed out.
      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cendatur.xcodeproj \
            -scheme Cendatur \
            -configuration Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            APP_ENTITLEMENTS=Support/Cendatur-AdHoc.entitlements \
            | tail -40

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cendatur.xcodeproj \
            -scheme Cendatur \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            APP_ENTITLEMENTS=Support/Cendatur-AdHoc.entitlements \
            | tee "$RUNNER_TEMP/test.log" | tail -60

      # The tail above keeps the summary but cuts the per-test issue lines;
      # on a failure, show those.
      - name: Test issues
        if: failure()
        run: grep -E "recorded an issue|XCTAssert" "$RUNNER_TEMP/test.log"

      - name: Package build artifact
        run: |
          PRODUCTS="$(xcodebuild -project Cendatur.xcodeproj -scheme Cendatur \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk '/ BUILT_PRODUCTS_DIR =/{print $3}')"
          ditto -c -k --keepParent "$PRODUCTS/Cendatur.app" Cendatur-ci.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Cendatur-ci
          path: Cendatur-ci.zip
